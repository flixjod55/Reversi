  <div id="app">
    <header class="topbar" id="topbar" hidden>
      <div class="brand"><span class="logo-disc" aria-hidden="true"></span>REVERSI<em>PRIME</em></div>
      <div class="spacer"></div>
      <button class="player-chip" id="chip-profile" aria-label="Open profile">
        <span class="avatar" id="chip-avatar">P</span>
        <span class="meta">
          <span class="name" id="chip-name">Player</span>
          <span class="lvl" id="chip-level">LV 1</span>
        </span>
      </button>
      <span class="presence-dot" id="presence-dot" title="Online status"></span>
      <button class="icon-btn" id="btn-sound" aria-label="Toggle sound" aria-pressed="true">
        <svg class="icon"><use href="#i-volume"></use></svg>
      </button>
      <button class="icon-btn" id="btn-settings" aria-label="Open settings">
        <svg class="icon"><use href="#i-settings"></use></svg>
      </button>
    </header>

    <main id="main">
      <section class="screen" id="screen-onboard" aria-label="Create your profile"></section>
      <section class="screen" id="screen-home" aria-label="Play hub"></section>
      <section class="screen" id="screen-game" aria-label="Match"></section>
      <section class="screen" id="screen-career" aria-label="Career"></section>
      <section class="screen" id="screen-friends" aria-label="Friends"></section>
      <section class="screen" id="screen-missions" aria-label="Missions"></section>
      <section class="screen" id="screen-profile" aria-label="Profile and settings"></section>
      <section class="screen" id="screen-room" aria-label="Room lobby"></section>
    </main>

    <nav class="bottomnav" id="bottomnav" aria-label="Main navigation"></nav>
  </div>

  <div class="modal-root" id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
